[project]
name = "control-picking"
version = "1.0.2"
description = "Control de Picking"
requires-python = ">=3.12"
dependencies = [
    "flet==1.1.2",
    "flet-camera==1.1.2",
    "flet-permission-handler==1.1.2",
    "pillow",
    "requests",
    "zxing-cpp",
]

[tool.flet]
product = "Control de Picking"
org = "cl.controlpicking"

[tool.flet.android]
build_number = 3

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.INTERNET" = true