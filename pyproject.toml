$toml = @"
[project]
name = "picking-tracker"
version = "1.0.0"
description = "Aplicacion de seguimiento de picking"
requires-python = ">=3.9"
dependencies = [
    "flet",
    "opencv-python-headless",
    "zxing-cpp",
]

[tool.flet]
org = "com.tecnotips"
product = "Picking Tracker"

[tool.flet.android]
permission."android.permission.CAMERA" = true
"@

[System.IO.File]::WriteAllText("$PWD\pyproject.toml", $toml, [System.Text.UTF8Encoding]::new($false))
