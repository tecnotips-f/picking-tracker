name: Compilar APK Flet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Generar pyproject.toml limpio
        run: |
          cat << 'EOF' > pyproject.toml
          [project]
          name = "picking-tracker"
          version = "1.0.0"
          description = "Aplicacion de seguimiento de picking"
          requires-python = ">=3.9"
          dependencies = [
              "flet",
              "opencv-python-headless",
              "zxing-cpp",
          ]

          [tool.flet]
          org = "com.tecnotips"
          product = "Picking Tracker"

          [tool.flet.android]
          permission."android.permission.CAMERA" = true
          EOF

      - name: Instalar dependencias de Python y Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar APK
        run: flet build apk --yes

      - name: Subir APK generado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: picking-tracker-apk
          path: build/apk/*.apk
          if-no-files-found: error