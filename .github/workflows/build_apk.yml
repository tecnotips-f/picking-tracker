name: Compilar APK Flet

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Instalar Flet y dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "flet[all]==1.1.2" requests pillow

      - name: Compilar APK
        run: flet build apk --yes

      - name: Subir APK generado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: picking-tracker-apk
          path: build/apk/*.apk
          if-no-files-found: error